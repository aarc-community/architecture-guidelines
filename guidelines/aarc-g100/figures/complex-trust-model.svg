<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" font-family="Liberation Sans, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#990000"/></marker>
  </defs>
  <g fill="#9fc5e8" stroke="#000">
    <rect x="60" y="20" width="110" height="46"/>
    <rect x="60" y="120" width="110" height="46"/>
    <rect x="190" y="120" width="110" height="46"/>
    <rect x="380" y="20" width="110" height="46"/>
    <rect x="380" y="120" width="110" height="46"/>
  </g>
  <g text-anchor="middle">
    <text x="115" y="40">Trust</text><text x="115" y="56">Authority 1</text>
    <text x="115" y="140">Trust</text><text x="115" y="156">Authority 3</text>
    <text x="245" y="140">Trust</text><text x="245" y="156">Authority 4</text>
    <text x="435" y="40">Trust</text><text x="435" y="56">Authority 2</text>
    <text x="435" y="140">Trust</text><text x="435" y="156">Authority 5</text>
  </g>
  <rect x="120" y="230" width="100" height="46" fill="#ffe599" stroke="#000"/>
  <text x="170" y="258" text-anchor="middle">Proxy A</text>
  <rect x="385" y="230" width="100" height="46" fill="#ffe599" stroke="#000"/>
  <text x="435" y="258" text-anchor="middle">Proxy B</text>
  <!-- Statements a Trust Authority can issue about its subordinates -->
  <g stroke="#000" marker-end="url(#b)">
    <line x1="115" y1="66" x2="115" y2="118"/>
    <line x1="125" y1="166" x2="160" y2="228"/>
    <line x1="235" y1="166" x2="185" y2="228"/>
    <line x1="435" y1="66" x2="435" y2="118"/>
    <line x1="435" y1="166" x2="435" y2="228"/>
  </g>
  <!-- Trust Anchors each Proxy trusts -->
  <g fill="none" stroke="#990000" stroke-dasharray="5 3" marker-end="url(#r)">
    <path d="M120,262 C40,250 30,110 58,48"/>
    <path d="M140,230 C130,205 115,190 115,168"/>
    <path d="M220,250 C300,240 300,60 378,45"/>
    <path d="M385,250 C330,230 360,90 172,40"/>
  </g>
  <line x1="220" y1="268" x2="385" y2="268" stroke="#000" stroke-dasharray="4 3"/>
  <text x="302" y="290" text-anchor="middle" font-size="12">no direct trust relationship</text>
  <text x="520" y="215" font-size="13" fill="#555">Legend:</text>
  <line x1="520" y1="235" x2="548" y2="235" stroke="#990000" stroke-dasharray="5 3" marker-end="url(#r)"/>
  <text x="555" y="239" font-size="11" fill="#555">trusts Trust</text>
  <text x="555" y="252" font-size="11" fill="#555">Anchor</text>
  <line x1="520" y1="270" x2="548" y2="270" stroke="#000" marker-end="url(#b)"/>
  <text x="555" y="274" font-size="11" fill="#555">can issue statement</text>
  <text x="555" y="287" font-size="11" fill="#555">about subordinate</text>
</svg>
